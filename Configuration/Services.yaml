services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiBase\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'

  Maispace\MaiBase\EventListener\SmokeTestContentFilterListener:
    tags:
      - name: event.listener
        identifier: 'mai-base/smoke-test-filter'
        event: TYPO3\CMS\Frontend\Event\AfterContentHasBeenFetchedEvent

  Maispace\MaiBase\EventListener\SmokeTestResolveContentAreasListener:
    tags:
      - name: event.listener
        identifier: 'mai-base/smoke-test-content-areas'
        event: TYPO3\CMS\Core\Page\ResolveContentAreasEvent
        priority: -100

  Maispace\MaiBase\Backend\CustomPageModule\CustomPageModuleListingContext:
    public: true
    shared: true

  Maispace\MaiBase\EventListener\FilterCustomPageModuleListingListener:
    tags:
      - name: event.listener
        identifier: 'mai-base/filter-custom-page-module-listing'
        event: TYPO3\CMS\Backend\View\Event\ModifyDatabaseQueryForRecordListingEvent
